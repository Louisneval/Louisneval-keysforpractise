<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keys and Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: light workbench page, dark terminal/editor panes as the single bold object, keycaps as the accent */
:root{
  --bg:#eceff4; --panel:#ffffff; --ink:#131a28; --muted:#586177; --line:#d3d8e2;
  --accent:#2f4bff; --accent-ink:#ffffff; --soft:#e2e7ff; --good:#14804a; --bad:#c62f3a;
  --t-bg:#0d1320; --t-bar:#182036; --t-ink:#dbe3f0; --t-ghost:#56647f; --t-ok:#8fe3b0; --t-bad:#ff7a7a; --t-amber:#ffcb6b; --t-line:#26304a;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e16; --panel:#131a28; --ink:#e7ebf3; --muted:#8e99ae; --line:#252f47;
    --accent:#8da0ff; --accent-ink:#0a0e16; --soft:#1c2646; --good:#6fdca2; --bad:#ff7d86;
    --t-bg:#070b13; --t-bar:#121a2c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e16; --panel:#131a28; --ink:#e7ebf3; --muted:#8e99ae; --line:#252f47;
  --accent:#8da0ff; --accent-ink:#0a0e16; --soft:#1c2646; --good:#6fdca2; --bad:#ff7d86;
  --t-bg:#070b13; --t-bar:#121a2c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--display)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand h1{margin:0;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.05;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted)}
.right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 12px;font:500 .85rem var(--mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:10px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.banner{background:#ffe9b8;color:#4a3300;border:1px solid #e0b64f;padding:10px 14px;border-radius:10px;font-weight:500}
.coarse{display:none;color:var(--muted);font-size:.9rem}
@media (pointer:coarse){.coarse{display:block}}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}.right{align-items:flex-start}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;max-height:78vh;overflow:auto}
.side h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 8px 4px;font-weight:500}
.lesson{display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:10px}
.lesson:hover{background:var(--soft)}
.lesson[aria-current="true"]{background:var(--soft);border-color:var(--accent)}
.lesson b{font-weight:500}
.lesson .tag{font:500 .72rem var(--mono);color:var(--muted);align-self:center}
.lesson small{grid-column:1/-1;color:var(--muted);font:400 .74rem var(--mono)}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.head h2{margin:0;font-size:1.35rem;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);max-width:60ch;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:9px;font-size:.9rem}
.ctl label{font-size:.9rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font:700 1.35rem var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.task{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:2px 2px}
.task .step{font:500 .78rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.task .hint{font-size:1.1rem;font-weight:500}
.focus-note{color:var(--muted);font-size:.9rem}
.platnote{margin:4px 8px 6px;color:var(--muted);font-size:.8rem;line-height:1.35}
/* terminal / editor panes */
.term{background:var(--t-bg);color:var(--t-ink);border-radius:14px;overflow:hidden;border:1px solid var(--t-line);box-shadow:0 14px 34px -22px rgba(10,16,40,.7)}
.term .bar{background:var(--t-bar);display:flex;align-items:center;gap:6px;padding:9px 14px;font:500 .78rem var(--mono);color:var(--t-ghost)}
.term .bar i{width:10px;height:10px;border-radius:50%;background:var(--t-line)}
.term .bar span{margin-left:8px}
.term .body{padding:16px 18px;font:500 1.05rem/1.7 var(--mono);min-height:260px;max-height:58vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term.mini .body{min-height:0;max-height:none;padding:10px 16px}
.ln{display:block}
.pr{color:var(--t-amber)}
.dim{color:var(--t-ghost)}
.outp{color:var(--t-ink);opacity:.82;margin-bottom:6px}
.c{white-space:pre}
.c.pend{color:var(--t-ghost)}
.c.ok{color:var(--t-ok)}
.c.bad{background:var(--t-bad);color:#1a0b0d;border-radius:2px}
.c.cur{background:var(--t-amber);color:#0d1320;border-radius:2px}
.c.nl{opacity:.8}
.ind{display:inline-block}
.shake{animation:shake .28s}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none;outline:2px solid var(--t-bad)}}
/* editor mock */
.vs{background:var(--t-bg);border:1px solid var(--t-line);border-radius:14px;overflow:hidden;color:var(--t-ink)}
.vs-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--t-bar);padding:0 14px;font:500 .78rem var(--mono)}
.vs-bar .tab{background:var(--t-bg);padding:9px 14px;border-top:2px solid var(--t-amber)}
.vs-bar .toast{color:var(--t-ok)}
.vs-ed{display:grid;grid-template-columns:auto 1fr;min-height:250px;max-height:46vh;overflow:auto;font:500 .98rem/1.65 var(--mono)}
.gut{padding:12px 12px 12px 10px;color:var(--t-ghost);user-select:none;border-right:1px solid var(--t-line)}
.gl{display:flex;justify-content:flex-end;align-items:center;gap:6px;min-height:1.65em}
.gl .bp{width:.7em;height:.7em;border-radius:50%;background:#ff5d6c;display:inline-block}
.gl .arrow{color:var(--t-amber);font-size:.8em;font-style:normal}
.code{padding:12px 16px;white-space:pre;overflow-x:auto}
.cl{display:block;min-height:1.65em}
.cl.cur{background:rgba(255,203,107,.18);box-shadow:-16px 0 0 rgba(255,203,107,.18)}
.pv,.pv *{box-sizing:content-box}
.pv{background:#fff;color:#161616;font:16px/1.4 Georgia,"Times New Roman",serif;padding:16px;min-height:90px;overflow:auto}
.pv .empty{color:#8a8f99;font-family:system-ui,sans-serif;font-size:.9rem}
.pv .res{font:500 .9rem var(--mono);padding:3px 0}
.pv .res b{display:inline-block;min-width:6.5em;color:#2f4bff}
.pv a{color:#0b57d0;text-decoration:underline}
.code .ok{color:var(--t-ok)}
.code .bad{background:var(--t-bad);color:#1a0b0d}
.caret{display:inline-block;width:2px;height:1.2em;background:var(--t-amber);vertical-align:text-bottom;margin-left:-1px}
.vs-out{border-top:1px solid var(--t-line)}
.vs-out .h{background:var(--t-bar);padding:5px 14px;font:500 .72rem var(--mono);color:var(--t-ghost);text-transform:uppercase;letter-spacing:.08em}
.vs-out pre{margin:0;padding:10px 16px;font:500 .95rem/1.5 var(--mono);min-height:56px;max-height:150px;overflow:auto}
/* keycaps */
kbd{font:700 1rem var(--mono);padding:.4em .75em;border:1px solid var(--line);border-bottom-width:4px;border-radius:9px;background:var(--panel);color:var(--ink);display:inline-block;min-width:2.4em;text-align:center}
.caps{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.grp{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp b{color:var(--muted);font-weight:400}
.grp.done kbd{background:var(--good);color:#fff;border-color:var(--good)}
.caps em{font-style:normal;color:var(--muted);font-size:.85rem}
kbd.mask{border-style:dashed;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.keystep{display:flex;flex-direction:column;gap:12px}
.drill{display:flex;flex-direction:column;gap:18px;padding:24px 22px}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.ddesc{font-size:clamp(1.4rem,3.4vw,2rem);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.dnote{color:var(--muted);font-size:.9rem}
.drill .caps kbd{font-size:1.25rem}
/* results */
.result{display:flex;flex-direction:column;gap:16px}
.result h3{margin:0;font-size:1.6rem}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{display:block;font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile b{font:700 1.8rem var(--mono)}
.slow{margin:0;padding-left:1.2em;color:var(--muted)}
.slow b{color:var(--ink);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 18px;border-radius:10px;font-weight:500}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foot{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="h1">Keys &amp; Code</h1>
      <p id="sub"></p>
    </div>
    <div class="right">
      <div class="opts">
        <div class="seg" id="seg-plat" role="group" aria-label="System"></div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Modes"></nav>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="coarse" id="coarse"></div>
  <div class="layout">
    <aside class="side" id="side"></aside>
    <main class="stage" id="stage"></main>
  </div>
  <footer class="foot" id="foot"></footer>
</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(s){ s=Math.round(s); var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
function B(en){ return en; }

/* ---------- state ---------- */
var isMacGuess=false;
try{ isMacGuess=/Mac/i.test(navigator.platform||navigator.userAgent||''); }catch(e){}
var state={mode:'term',S:null,showHint:true,last:{},plat:isMacGuess?'mac':'win'};
var BEST={};
try{ BEST=JSON.parse(localStorage.getItem('kk-best')||'{}'); }catch(e){ BEST={}; }
try{ var P=JSON.parse(localStorage.getItem('kk-prefs')||'{}'); if(P.plat) state.plat=P.plat; }catch(e){}
function saveBest(){ try{ localStorage.setItem('kk-best',JSON.stringify(BEST)); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem('kk-prefs',JSON.stringify({plat:state.plat})); }catch(e){} }
function tr(o){ return o; }
function mac(){ return state.plat==='mac'; }

/* ---------- UI strings ---------- */
var UI={
 sub:B('Typing trainer for programmers: terminal, SQL, editor, code.'),
 banner:B('You are typing non-Latin letters. Switch your keyboard layout to English.'),
 coarse:B('You need a physical keyboard. This does not work on a phone or tablet.'),
 footWin:B('Shortcuts come from Visual Studio for Windows. If the browser steals a shortcut, press Esc to skip the step.'),
 footMac:B('On Mac the shortcuts follow VS Code, because Visual Studio for Mac was retired. Alt is Option, Ctrl is Control. On a MacBook hold fn with F1-F12. If the browser steals a shortcut, press Esc to skip.'),
 lessons:B('Lessons'), best:B('best'),
 time:B('Time'), wpm:B('Speed, WPM'), rate:B('Shortcuts/min'), acc:B('Accuracy'), errs:B('Errors'),
 again:B('Restart'), next:B('Next lesson'), skip:B('Skip'),
 showkeys:B('Show keys'), clickfocus:B('Click the window and start typing.'),
 done:B('Done'), lowacc:B('Accuracy is below 95%. Type cleanly first, speed will follow.'),
 okacc:B('Accuracy is above 95%. You can speed up.'),
 slowest:B('Slowest to find:'),
 step:B('Step'), of:B('of'), combo:B('Shortcut'), escskip:B('Esc skips the shortcut.'),
 termTitle:B('Command line'), output:B('Output'), chars:B('characters'), items12:B('12 items'),
 howTerm:B('Type the commands like in a real terminal. Enter submits the line, Backspace deletes a character.'),
 howSql:B('Type whole queries, with the semicolon. Keywords are uppercase, so watch your Shift key.'),
 howDrill:B('Press the shortcut you are asked for. Layout does not matter. For two-part shortcuts, press the parts one after another.'),
 howVs:B('Type text and press shortcuts like in a real editor. Indentation after Enter is added for you.'),
 howEmmet:B('Emmet is built into VS Code: type a short abbreviation, press Tab, get ready-made markup.'),
 howCode:B('Type the whole snippet. Indentation is added for you: after Enter just type the line text.'),
 macNote:B('Mac: VS Code keymap is used.')
};
function u(k){ return UI[k]; }

/* ---------- key specs ---------- */
var NAMES={Tab:'Tab',Enter:'Enter',Space:'Space',Up:'ArrowUp',Down:'ArrowDown',Left:'ArrowLeft',Right:'ArrowRight',Home:'Home',End:'End',Esc:'Escape','.':'Period',',':'Comma','-':'Minus','`':'Backquote','/':'Slash'};
function parseKeys(spec,isMac){
  return spec.split(' ').map(function(tok){
    var parts=tok.split('+'), c={ctrl:false,cmd:false,shift:false,alt:false,code:'',parts:parts,mac:!!isMac};
    parts.forEach(function(p){
      if(p==='Ctrl') c.ctrl=true; else if(p==='Cmd') c.cmd=true; else if(p==='Shift') c.shift=true; else if(p==='Alt') c.alt=true;
      else if(/^[A-Z]$/.test(p)) c.code='Key'+p;
      else if(/^[0-9]$/.test(p)) c.code='Digit'+p;
      else if(/^F\d+$/.test(p)) c.code=p;
      else c.code=NAMES[p]||p;
    });
    return c;
  });
}
function matches(e,c){
  if(e.shiftKey!==c.shift||e.altKey!==c.alt||e.code!==c.code) return false;
  if(c.mac) return e.metaKey===c.cmd && e.ctrlKey===c.ctrl;
  return (e.ctrlKey||e.metaKey)===c.ctrl;
}
var MACLAB={Cmd:'⌘ Cmd',Alt:'⌥ Option',Shift:'⇧ Shift',Ctrl:'⌃ Control',Enter:'↩ Return',Tab:'⇥ Tab'};
function label(p,isMac){ if(isMac&&MACLAB[p]) return MACLAB[p]; return {Up:'↑',Down:'↓',Left:'←',Right:'→'}[p]||p; }
var MOD=/^(Control|Shift|Alt|Meta|OS|CapsLock|AltGraph)/;

/* ---------- data: terminal ---------- */
function st(en,win,out,cd,m,mout){ return {kind:'type',submit:true,hint:en,win:win,mac:(m==null?win:m),out:out||'',mout:(mout==null?(out||''):mout),cd:cd||''}; }
var TERM=[
 {id:'py',title:B('Python: Hello World','Python: Hello World'),tag:'Python',steps:[
  st('Create the project folder','mkdir hello'),
  st('Go into the folder','cd hello','','hello'),
  st('Write the code into hello.py','echo print("Hello, World!") > hello.py','','',"echo 'print(\"Hello, World!\")' > hello.py"),
  st('Show the file contents','type hello.py','print("Hello, World!")','','cat hello.py'),
  st('Check the Python version','python --version','Python 3.12.4','','python3 --version'),
  st('Run the program','python hello.py','Hello, World!','','python3 hello.py')]},
 {id:'js',title:B('JavaScript: Node.js','JavaScript: Node.js'),tag:'JS',steps:[
  st('Create the folder','mkdir hello'),
  st('Go into the folder','cd hello','','hello'),
  st('Write the code into hello.js','echo console.log("Hello, World!") > hello.js','','',"echo 'console.log(\"Hello, World!\")' > hello.js"),
  st('Check the Node version','node --version','v20.11.1'),
  st('Run it','node hello.js','Hello, World!')]},
 {id:'c',title:B('C: gcc','C: gcc'),tag:'C',steps:[
  st('Create the folder','mkdir hello'),
  st('Go into the folder','cd hello','','hello'),
  st('First line of the file (in cmd, < and > are escaped with ^)','echo #include ^<stdio.h^> > hello.c','','',"echo '#include <stdio.h>' > hello.c"),
  st('Append main (>> adds to the end of the file)','echo int main(){printf("Hello, World!\\n");} >> hello.c','','',"echo 'int main(){printf(\"Hello, World!\\n\");}' >> hello.c"),
  st('Compile','gcc hello.c -o hello'),
  st('Run it','hello','Hello, World!','','./hello')]},
 {id:'cpp',title:B('C++: g++','C++: g++'),tag:'C++',steps:[
  st('Create the folder','mkdir hello'),
  st('Go into the folder','cd hello','','hello'),
  st('Include iostream (in cmd, < and > are escaped with ^)','echo #include ^<iostream^> > hello.cpp','','',"echo '#include <iostream>' > hello.cpp"),
  st('Append main','echo int main(){std::cout ^<^< "Hello, World!\\n";} >> hello.cpp','','',"echo 'int main(){std::cout << \"Hello, World!\\n\";}' >> hello.cpp"),
  st('Compile','g++ hello.cpp -o hello'),
  st('Run it','hello','Hello, World!','','./hello')]},
 {id:'java',title:B('Java: javac','Java: javac'),tag:'Java',steps:[
  st('Create the folder','mkdir hello'),
  st('Go into the folder','cd hello','','hello'),
  st('Write the class into Hello.java','echo class Hello { public static void main(String[] a) { System.out.println("Hello, World!"); } } > Hello.java','','',"echo 'class Hello { public static void main(String[] a) { System.out.println(\"Hello, World!\"); } }' > Hello.java"),
  st('Compile','javac Hello.java'),
  st('Run the class','java Hello','Hello, World!')]},
 {id:'go',title:B('Go: go run','Go: go run'),tag:'Go',steps:[
  st('Create the folder','mkdir hello'),
  st('Go into the folder','cd hello','','hello'),
  st('Create the module','go mod init hello','go: creating new go.mod: module hello'),
  st('Write main.go','echo package main; import "fmt"; func main() { fmt.Println("Hello, World!") } > main.go','','',"echo 'package main; import \"fmt\"; func main() { fmt.Println(\"Hello, World!\") }' > main.go"),
  st('Run it','go run .','Hello, World!')]},
 {id:'rust',title:B('Rust: cargo','Rust: cargo'),tag:'Rust',steps:[
  st('Create the project','cargo new hello','    Creating binary (application) `hello` package'),
  st('Go into the folder','cd hello','','hello'),
  st('Build and run','cargo run','   Compiling hello v0.1.0\n    Finished `dev` profile\n     Running `target\\debug\\hello.exe`\nHello, world!','','','   Compiling hello v0.1.0\n    Finished `dev` profile\n     Running `target/debug/hello`\nHello, world!')]},
 {id:'cs',title:B('C#: dotnet','C#: dotnet'),tag:'C#',steps:[
  st('Create a console project in folder hello','dotnet new console -o hello','The template "Console App" was created successfully.'),
  st('Go into the folder','cd hello','','hello'),
  st('Run it','dotnet run','Hello, World!')]},
 {id:'git',title:B('Git: first commit'),tag:'Git',steps:[
  st('Create the folder','mkdir shop'),
  st('Go into the folder','cd shop','','shop'),
  st('Create the repository','git init','Initialized empty Git repository in C:/dev/shop/.git/','','','Initialized empty Git repository in /Users/you/dev/shop/.git/'),
  st('Create a README','echo # Shop > README.md','','',"echo '# Shop' > README.md"),
  st('Stage everything','git add .'),
  st('Make a commit','git commit -m "first commit"','[main (root-commit) 3f2a1b9] first commit\n 1 file changed, 1 insertion(+)\n create mode 100644 README.md'),
  st('View the history','git log --oneline','3f2a1b9 (HEAD -> main) first commit')]},

/* ---------- sessions ---------- */
function resolveItem(raw){
  var m=mac(), o={};
  for(var k in raw) o[k]=raw[k];
  if(raw.kind==='keys'){ o.keys=m?raw.mac:raw.win; o.combos=parseKeys(o.keys,m); }
  else if(raw.win!==undefined){ o.text=m?raw.mac:raw.win; o.out=m?raw.mout:raw.out; }
  return o;
}
function newSession(L){
  var items;
  if(L.kind==='drill'){
    var seen={}, pool=KEYS.filter(function(k){ var key=mac()?k[2]:k[1]; if(seen[key]) return false; seen[key]=1; return true; });
    items=shuffle(pool).slice(0,12).map(function(k){ return resolveItem({kind:'keys',hint:k[0],win:k[1],mac:k[2]}); });
  } else items=L.items.map(resolveItem);
  return {lesson:L,items:items,i:0,typed:'',chord:0,startedAt:null,endAt:null,correct:0,total:0,errors:0,typedOk:0,
    hist:[],cwd:'',bp:[],cur:0,panel:null,base:L.base||'',out:'',toast:'',flash:false,done:false,times:[],stepStart:0,revealed:false,rt:null};
}
function enterItem(S){
  S.stepStart=Date.now(); S.revealed=false; clearTimeout(S.rt);
  if(S.items[S.i] && S.items[S.i].kind==='keys' && !state.showHint){
    S.rt=setTimeout(function(){ if(state.S===S && !S.done){ S.revealed=true; renderStage(); } },4000);
  }
}
function selectLesson(id){
  var L=ALL.filter(function(l){return l.id===id;})[0]; if(!L) return;
  if(state.S) clearTimeout(state.S.rt);
  state.mode=L.mode; state.last[L.mode]=id;
  state.S=newSession(L); enterItem(state.S);
  renderChrome(); renderSide(); renderStage();
}

/* ---------- input ---------- */
function start(S){ if(!S.startedAt) S.startedAt=Date.now(); }
function promptOf(S){
  if(S.lesson.kind==='sql') return 'sql> ';
  return mac() ? '~/dev'+S.cwd+' % ' : 'C:\\dev'+S.cwd+'> ';
}
function insertAtMarker(base,text){
  var idx=base.indexOf('|'); if(idx<0) return base+text;
  var before=base.slice(0,idx), after=base.slice(idx+1);
  var ls=before.lastIndexOf('\n')+1, indent=before.slice(ls).match(/^ */)[0];
  return before+text.replace(/\n/g,'\n'+indent)+'|'+after;
}
function advance(S){
  S.i++; S.typed=''; S.chord=0;
  if(S.i>=S.items.length){ finish(S); } else { enterItem(S); }
  renderStage();
}
function completeType(S,it){
  if(S.lesson.kind==='term'||S.lesson.kind==='sql'){
    S.hist.push({p:promptOf(S),t:it.text,o:it.out||''});
    if(it.cd) S.cwd+=(mac()?'/':'\\')+it.cd;
  } else if(S.lesson.kind==='vs'){ S.base=insertAtMarker(S.base,it.text); }
  advance(S);
}
function completeKeys(S,it,skipped){
  if(!skipped) S.times.push({d:it.hint,t:(Date.now()-S.stepStart)/1000});
  if(it.set!==undefined) S.base=it.set;
  if(it.bp!==undefined) S.bp=it.bp;
  if(it.cur!==undefined) S.cur=it.cur;
  if(it.panel!==undefined) S.panel=it.panel;
  S.toast=it.toast||'';
  if(it.out) S.out+=(S.out?'\n':'')+it.out;
  advance(S);
}
function addChar(S,it,ch){
  if(S.typed.length>=it.text.length+3){ S.flash=true; renderStage(); return; }
  start(S);
  var pos=S.typed.length, ok=it.text.indexOf(S.typed)===0 && it.text[pos]===ch;
  S.total++; if(ok){ S.correct++; S.typedOk++; } else { S.errors++; }
  S.typed+=ch;
  if(!it.submit && S.typed===it.text){ completeType(S,it); return; }
  renderStage();
}
function typeInput(e,S,it){
  var k=e.key;
  if(k==='Backspace'){
    e.preventDefault();
    S.typed=(e.ctrlKey||e.altKey)? S.typed.replace(/\S*\s*$/,'') : S.typed.slice(0,-1);
    renderStage(); return;
  }
  if(k==='Enter'){
    e.preventDefault();
    if(it.submit){
      start(S); S.total++;
      if(S.typed===it.text){ S.correct++; S.typedOk++; completeType(S,it); }
      else { S.errors++; S.flash=true; renderStage(); }
      return;
    }
    addChar(S,it,'\n'); return;
  }
  if(k.length===1){
    if((e.ctrlKey||e.metaKey) && !e.getModifierState('AltGraph')) return;
    e.preventDefault();
    if(/[\u0400-\u04FF]/.test(k)){ $('#banner').textContent=u('banner'); $('#banner').hidden=false; return; }
    $('#banner').hidden=true;
    addChar(S,it,k);
  }
}
function keysInput(e,S,it){
  if(MOD.test(e.code)) return;
  e.preventDefault();
  if(e.code==='Escape'){ completeKeys(S,it,true); return; }
  start(S); S.total++;
  var c=it.combos[S.chord];
  if(matches(e,c)){
    S.correct++; S.chord++;
    if(S.chord>=it.combos.length){ completeKeys(S,it,false); return; }
  } else {
    S.errors++; S.flash=true; S.chord=matches(e,it.combos[0])?1:0;
  }
  renderStage();
}
window.addEventListener('keydown',function(e){
  var S=state.S; if(!S||S.done||e.isComposing) return;
  var it=S.items[S.i]; if(!it) return;
  if(it.kind==='keys') keysInput(e,S,it); else typeInput(e,S,it);
},true);

/* ---------- results ---------- */
function calc(S){
  var end=S.endAt||Date.now(), secs=S.startedAt?(end-S.startedAt)/1000:0, mins=secs/60;
  var wpm=mins>0.02 ? Math.round((S.lesson.kind==='drill' ? S.times.length : S.typedOk/5)/mins) : 0;
  var acc=S.total?Math.round(100*S.correct/S.total):100;
  return {secs:secs,wpm:wpm,acc:acc,errors:S.errors};
}
function finish(S){
  S.done=true; S.endAt=Date.now(); clearTimeout(S.rt);
  var r=calc(S), key=S.lesson.id+(S.lesson.mode==='term'||S.lesson.kind==='vs'||S.lesson.kind==='drill'?'|'+state.plat:''), b=BEST[key]||{};
  if(S.startedAt){
    if(!b.wpm||r.wpm>b.wpm) b.wpm=r.wpm;
    if(!b.time||r.secs<b.time) b.time=r.secs;
    BEST[key]=b; saveBest();
  }
  renderSide();
}

/* ---------- rendering ---------- */
function renderChrome(){
  $('#sub').textContent=u('sub');
  $('#coarse').textContent=u('coarse');
  $('#foot').textContent=mac()?u('footMac'):u('footWin');
  $('#seg-plat').innerHTML=[['win','Windows'],['mac','Mac']].map(function(p){ return '<button type="button" data-plat="'+p[0]+'" aria-pressed="'+(state.plat===p[0])+'">'+p[1]+'</button>'; }).join('');
  $('#tabs').innerHTML=MODES.map(function(m){
    return '<button type="button" role="tab" data-mode="'+m[0]+'" aria-selected="'+(state.mode===m[0])+'">'+esc(tr(m[1]))+'</button>';
  }).join('');
}
function bestKey(l){ return l.id+(l.mode==='term'||l.mode==='vs'?'|'+state.plat:''); }
function renderSide(){
  var list=ALL.filter(function(l){return l.mode===state.mode;});
  var cur=state.S&&state.S.lesson.id;
  $('#side').innerHTML='<h2>'+u('lessons')+'</h2>'+(state.mode==='vs'&&mac()?'<div class="platnote">'+esc(u('macNote'))+'</div>':'')+list.map(function(l){
    var b=BEST[bestKey(l)];
    return '<button type="button" class="lesson" data-lesson="'+l.id+'"'+(l.id===cur?' aria-current="true"':'')+'><b>'+esc(tr(l.title))+'</b><span class="tag">'+esc(l.tag)+'</span>'+
      (b?'<small>'+u('best')+': '+b.wpm+' WPM · '+fmt(b.time)+'</small>':'')+'</button>';
  }).join('');
}
function typedHtml(text,typed,indents){
  function ind(k){ return (indents&&indents[k]) ? '<span class="ind" style="width:'+indents[k]+'ch"></span>' : ''; }
  var h=ind(0), line=0, n=Math.max(text.length,typed.length);
  for(var i=0;i<n;i++){
    var exp=text[i], got=typed[i], cls, ch;
    if(i<typed.length){
      if(exp===undefined){ cls='bad'; ch=got; } else { cls=got===exp?'ok':'bad'; ch=exp; }
    } else { cls=i===typed.length?'pend cur':'pend'; ch=exp; }
    if(ch==='\n'){ h+='<span class="c '+cls+' nl">↵</span><br>'; line++; h+=ind(line); }
    else h+='<span class="c '+cls+'">'+esc(ch)+'</span>';
  }
  if(typed.length>=text.length) h+='<span class="c cur"> </span>';
  return h;
}
function capsHtml(S,it){
  var show=state.showHint||S.revealed, m=mac();
  return '<div class="caps">'+it.combos.map(function(c,ci){
    var inner=show ? c.parts.map(function(p){return '<kbd>'+esc(label(p,m))+'</kbd>';}).join('<b>+</b>') : '<kbd class="mask">?</kbd>';
    return '<span class="grp'+(ci<S.chord?' done':'')+'">'+inner+'</span>';
  }).join('<em>'+'then'+'</em>')+'</div>';
}
function statsHtml(S){
  var r=calc(S), drill=S.lesson.kind==='drill';
  return '<div class="stat"><span>'+u('time')+'</span><b>'+fmt(r.secs)+'</b></div>'+
    '<div class="stat"><span>'+(drill?u('rate'):u('wpm'))+'</span><b>'+r.wpm+'</b></div>'+
    '<div class="stat"><span>'+u('acc')+'</span><b>'+r.acc+'%</b></div>'+
    '<div class="stat"><span>'+u('errs')+'</span><b>'+r.errors+'</b></div>';
}
function stepBar(S,it){
  return '<div class="task"><span class="step">'+u('step')+' '+(S.i+1)+' '+u('of')+' '+S.items.length+'</span><span class="hint">'+esc(tr(it.hint))+'</span></div>';
}
function termBody(S){
  var L=S.lesson, it=S.items[S.i], sql=L.kind==='sql';
  var intro=sql ? 'SQLite version 3.45.1\nEnter ".help" for usage hints.' : (mac()?'Last login: Sat Nov 21 13:49:02 on ttys001':'Microsoft Windows [Version 10.0.22631.4460]');
  var hist=S.hist.map(function(h){
    return '<span class="ln"><span class="pr">'+esc(h.p)+'</span>'+esc(h.t)+'</span>'+(h.o?'<div class="outp">'+esc(h.o)+'</div>':'');
  }).join('');
  var cur='<span class="ln"><span class="pr">'+esc(promptOf(S))+'</span>'+typedHtml(it.text,S.typed,null)+'</span>';
  return stepBar(S,it)+
    '<div class="term'+(S.flash?' shake':'')+'"><div class="bar"><i></i><i></i><i></i><span>'+(sql?'sqlite3 shop.db':(mac()?'Terminal, zsh':u('termTitle')))+'</span></div>'+
    '<div class="body" id="tbody"><div class="dim">'+esc(intro)+'</div>\n'+hist+cur+'</div></div>';
}
function codeBody(S){
  var L=S.lesson, it=S.items[0];
  return '<div class="term'+(S.flash?' shake':'')+'"><div class="bar"><i></i><i></i><i></i><span>'+esc(L.tag)+' · '+Math.min(S.typed.length,it.text.length)+' / '+it.text.length+' '+u('chars')+'</span></div>'+
    '<div class="body" id="tbody">'+typedHtml(it.text,S.typed,it.indents)+'</div></div>';
}
function editorHtml(S,it){
  var base=S.base, idx=base.indexOf('|'), before=idx<0?base:base.slice(0,idx), after=idx<0?'':base.slice(idx+1);
  var live='';
  if(it.kind==='type' && idx>=0){
    var ls=before.lastIndexOf('\n')+1, indent=before.slice(ls).match(/^ */)[0];
    for(var i=0;i<S.typed.length;i++){
      var ch=S.typed[i];
      if(ch==='\n'){ live+='\n'+indent; }
      else live+='<span class="'+(ch===it.text[i]?'ok':'bad')+'">'+esc(ch)+'</span>';
    }
  }
  var lines=(esc(before)+live+(idx>=0?'<span class="caret"></span>':'')+esc(after)).split('\n');
  var gut=lines.map(function(_,k){
    var n=k+1;
    return '<span class="gl">'+(S.bp.indexOf(n)>=0?'<i class="bp"></i>':'')+(S.cur===n?'<i class="arrow">&#9654;</i>':'')+n+'</span>';
  }).join('');
  var code=lines.map(function(l,k){ return '<span class="cl'+(S.cur===k+1?' cur':'')+'">'+(l||' ')+'</span>'; }).join('');
  return '<div class="vs-ed"><div class="gut">'+gut+'</div><div class="code">'+code+'</div></div>';
}
function previewHtml(S){
  var L=S.lesson, base=S.base.replace('|',''), inner='';
  if(L.view==='html'){
    var m=base.match(/<body>([\s\S]*?)<\/body>/), body=(m?m[1]:base).replace(/<script[\s\S]*?<\/script>|<link[^>]*>/gi,'');
    inner='<div class="pv">'+(body.trim()?body:'<span class="empty">Empty page: nothing to show yet</span>')+'</div>';
  } else if(L.view==='css'){
    inner='<style>.pv .box{width:70%;min-height:130px;outline:1px dashed #9aa3b5;font-family:system-ui,sans-serif}'+
      '.pv .box span{background:#cfd8ff;padding:10px 14px;margin:4px;border-radius:6px;color:#16204a;font-weight:600}'+
      base.replace(/\.box/g,'.pv .box')+'</style><div class="pv"><div class="box"><span>A</span><span>B</span><span>C</span></div></div>';
  } else {
    var rows=[];
    base.replace(/<link[^>]*href="([^"]*)"[^>]*>/g,function(x,h){ rows.push(['stylesheet',h]); return ''; });
    base.replace(/<script[^>]*src="([^"]*)"[^>]*>/g,function(x,h){ rows.push(['script',h]); return ''; });
    inner='<div class="pv">'+(rows.length?rows.map(function(r){ return '<div class="res"><b>'+r[0]+'</b> '+esc(r[1]||'(no file name yet)')+'</div>'; }).join(''):'<span class="empty">The page loads nothing extra yet</span>')+'</div>';
  }
  var title=L.view==='head'?'Files the browser loads':'Result in the browser';
  return '<div class="vs-out"><div class="h">'+title+'</div>'+inner+'</div>';
}
function vsBody(S){
  var L=S.lesson, it=S.items[S.i], task;
  if(it.kind==='type'){
    task=stepBar(S,it)+'<div class="term mini'+(S.flash?' shake':'')+'"><div class="body">'+typedHtml(it.text,S.typed,null)+'</div></div>';
  } else {
    task=stepBar(S,it)+'<div class="panel keystep'+(S.flash?' shake':'')+'">'+capsHtml(S,it)+'</div>';
  }
  var panes='';
  if(S.panel) panes+='<div class="vs-out"><div class="h">'+esc(S.panel.title)+'</div><pre>'+esc(S.panel.text)+'</pre></div>';
  if(L.view) panes+=previewHtml(S);
  else if(!L.noOut) panes+='<div class="vs-out"><div class="h">'+u('output')+'</div><pre>'+esc(S.out)+'</pre></div>';
  return task+'<div class="vs"><div class="vs-bar"><span class="tab">'+esc(L.file)+'</span><span class="toast">'+esc(tr(S.toast)||'')+'</span></div>'+
    editorHtml(S,it)+panes+'</div>';
}
function drillBody(S){
  var it=S.items[S.i];
  return '<div class="panel drill'+(S.flash?' shake':'')+'"><div class="prog"><i style="width:'+Math.round(100*S.i/S.items.length)+'%"></i></div>'+
    '<div class="dnote">'+u('combo')+' '+(S.i+1)+' '+u('of')+' '+S.items.length+'</div>'+
    '<div class="ddesc">'+esc(tr(it.hint))+'</div>'+capsHtml(S,it)+
    '<div class="dnote">'+u('escskip')+'</div></div>';
}
function resultBody(S){
  var r=calc(S), drill=S.lesson.kind==='drill', slow='';
  if(drill){
    var top=S.times.slice().sort(function(a,b){return b.t-a.t;}).slice(0,3);
    slow='<div><b>'+u('slowest')+'</b><ol class="slow">'+top.map(function(x){return '<li><b>'+esc(tr(x.d))+'</b> · '+x.t.toFixed(1)+' s</li>';}).join('')+'</ol></div>';
  }
  return '<div class="panel result"><h3>'+u('done')+'</h3><div class="tiles">'+
    '<div class="tile"><span>'+u('time')+'</span><b>'+fmt(r.secs)+'</b></div>'+
    '<div class="tile"><span>'+(drill?u('rate'):'WPM')+'</span><b>'+r.wpm+'</b></div>'+
    '<div class="tile"><span>'+u('acc')+'</span><b>'+r.acc+'%</b></div>'+
    '<div class="tile"><span>'+u('errs')+'</span><b>'+r.errors+'</b></div></div>'+
    '<div class="dnote">'+(r.acc<95?u('lowacc'):u('okacc'))+'</div>'+slow+
    '<div class="actions"><button type="button" class="btn main" data-act="again">'+u('again')+'</button><button type="button" class="btn" data-act="next">'+u('next')+'</button></div></div>';
}
function renderStage(){
  var S=state.S; if(!S) return;
  var L=S.lesson, it=S.items[S.i], keysy=(L.kind==='drill'||L.kind==='vs');
  var body;
  if(S.done) body=resultBody(S);
  else if(L.kind==='term'||L.kind==='sql') body=termBody(S);
  else if(L.kind==='code') body=codeBody(S);
  else if(L.kind==='vs') body=vsBody(S);
  else body=drillBody(S);
  var ctl='<div class="ctl">'+(keysy?'<label><input type="checkbox" id="showhint"'+(state.showHint?' checked':'')+'> '+u('showkeys')+'</label>':'')+
    (!S.done&&it&&it.kind==='keys'?'<button type="button" data-act="skip">'+u('skip')+'</button>':'')+
    '<button type="button" data-act="again">'+u('again')+'</button></div>';
  var focus=(!S.startedAt&&!S.done)?'<div class="focus-note">'+u('clickfocus')+'</div>':'';
  $('#stage').innerHTML='<div class="head"><div><h2>'+esc(tr(L.title))+'</h2><p>'+esc(u(L.how))+'</p></div>'+ctl+'</div>'+
    '<div class="stats" id="stats">'+statsHtml(S)+'</div>'+focus+body;
  var tb=$('#tbody'); if(tb) tb.scrollTop=tb.scrollHeight;
  S.flash=false;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target.closest('.pv')){ e.preventDefault(); return; }
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.mode){
    var m=t.dataset.mode, first=ALL.filter(function(l){return l.mode===m;})[0];
    selectLesson(state.last[m]||first.id);
  } else if(t.dataset.lesson){ selectLesson(t.dataset.lesson); }
  else if(t.dataset.plat){ state.plat=t.dataset.plat; savePrefs(); selectLesson(state.S.lesson.id); }
  else if(t.dataset.act==='again'){ selectLesson(state.S.lesson.id); }
  else if(t.dataset.act==='next'){
    var list=ALL.filter(function(l){return l.mode===state.mode;}), i=list.map(function(l){return l.id;}).indexOf(state.S.lesson.id);
    selectLesson(list[(i+1)%list.length].id);
  } else if(t.dataset.act==='skip'){
    var S=state.S, it=S.items[S.i]; if(it&&it.kind==='keys') completeKeys(S,it,true);
  }
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
});
document.addEventListener('change',function(e){
  if(e.target.id==='showhint'){ state.showHint=e.target.checked; if(state.S){ enterItem(state.S); } renderStage(); e.target.blur(); }
});
setInterval(function(){
  var S=state.S, box=$('#stats');
  if(S&&box&&S.startedAt&&!S.done) box.innerHTML=statsHtml(S);
},500);

selectLesson('t-py');
})();
</script>
</body>
